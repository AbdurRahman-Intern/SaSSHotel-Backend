# =============================================================================
# Backend CI  -  runs on every Pull Request into `develop` or `main`,
# and on every push to those two branches.
#
# TEAM FLOW
#   1. Create your own branch from develop:   git checkout develop && git pull && git checkout -b feature/my-task
#   2. Push it and open a Pull Request  ->  develop.   This workflow runs automatically.
#   3. Green check  = safe to review + merge.   Red X = click "Details", read the error, fix, push again.
#   4. When develop is stable, open a Pull Request  develop -> main.  CI runs again; merge if green.
#
# MERGE CONFLICTS
#   GitHub shows "This branch has conflicts" on the PR. Fix on your branch:
#     git fetch origin && git merge origin/develop     (resolve the files, then git commit && git push)
#   The `lint` job also fails if someone commits leftover <<<<<<< markers.
#
# REQUIRED SETTING (once, by the repo admin): Settings -> Branches -> add rules for `develop` and `main`:
#   [x] Require a pull request before merging
#   [x] Require status checks to pass  -> select:  "Lint & conflict markers"  and  "Tests (PHP 8.3 + MySQL)"
#   [x] Require branches to be up to date before merging
#   [x] Do not allow direct pushes (include administrators)
# =============================================================================
name: Backend CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# A newer push to the same branch cancels the older, now useless, run.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: fast checks (about 1 minute) - fails early on obvious problems.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & conflict markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on leftover merge-conflict markers
        run: |
          if grep -rnE '^(<<<<<<<|>>>>>>>) ' --include='*.php' --include='*.json' --include='*.md' --include='*.yml' . --exclude-dir=vendor --exclude-dir=node_modules --exclude-dir=.git; then
            echo "::error::Merge conflict markers found. Resolve the conflict and push again."
            exit 1
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: PHP syntax check (every .php file)
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

  # ---------------------------------------------------------------------------
  # Job 2: install, build the database on real MySQL, run the tests.
  # ---------------------------------------------------------------------------
  tests:
    name: Tests (PHP 8.4 + MySQL)
    runs-on: ubuntu-latest
    needs: lint

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hotel_saas_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: hotel_saas_ci
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, bcmath
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Proves the migrations + seeder work on a REAL MySQL (catches errors SQLite hides).
      - name: Migrate and seed MySQL
        run: php artisan migrate:fresh --seed --force

      # Code style (Laravel Pint). Report-only at first so beginners are not blocked.
      # When the team is comfortable, delete the continue-on-error line to enforce it.
      - name: Code style (Pint)
        run: vendor/bin/pint --test
        continue-on-error: true

      - name: Run tests
        run: php artisan test
